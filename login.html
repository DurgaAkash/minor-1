<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passenger Login | SmartRoute AI</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html">🚌 SmartRoute AI</a><nav class="main-nav"><a href="index.html">Home</a></nav></header>
  <main class="section">
    <div class="section-heading"><span class="eyebrow">PASSENGER ACCESS</span><h2>Welcome to SmartRoute AI</h2><p>Passenger NLP login will be implemented in the next development step.</p></div>
    <div class="feature-card" style="max-width:480px;margin:auto">
      <h3>AI Login Assistant</h3>
      <p style="margin:10px 0 18px">Try typing: “I am a passenger and want to travel by bus.”</p>
      <label for="login-intent">Tell us what you need</label>
      <input id="login-intent" type="text" placeholder="Type your message..." style="display:block;width:100%;padding:12px;margin:8px 0;border:1px solid #e1e9ef;border-radius:8px">
      <button class="button button-primary" type="button" onclick="showIntent()">Continue</button>
      <p id="intent-result" aria-live="polite" style="margin-top:14px"></p>
    </div>
  </main>
  <script src="js/login.js"></script>
</body></html>
