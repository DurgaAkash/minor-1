<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passenger Login | SmartRoute AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">🚌 SmartRoute AI</a>
    <nav class="main-nav"><a href="index.html">Home</a></nav>
  </header>
  <main class="section login-section">
    <div class="section-heading">
      <span class="eyebrow">PASSENGER ACCESS</span>
      <h2>Passenger Sign In</h2>
      <p>Sign in to access route search, passenger check-in and bus service requests.</p>
    </div>
    <section class="login-card">
      <label for="passenger-username">Username</label>
      <input id="passenger-username" type="text" placeholder="Enter username" autocomplete="username">
      <label for="passenger-password">Password</label>
      <input id="passenger-password" type="password" placeholder="Enter password" autocomplete="current-password">
      <button class="button button-primary full-button" type="button" onclick="passengerLogin()">Sign In</button>
      <p class="demo-note">Demo: username <strong>passenger</strong> · password <strong>travel123</strong></p>
      <p id="login-error" class="form-message" aria-live="polite"></p>
    </section>
  </main>
  <script src="js/api-config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
